<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pasaporte · Micaella & Jorge</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+SC:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon: #4c1420;
    --gold: #cba15a;
    --gold-light: #e9d3a3;
    --cream: #f2ece1;
    --ink: #2c2018;
    --bg: var(--cream);
    --fg: var(--ink);
    --card-shadow: rgba(30, 12, 8, 0.35);
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg: #1c1210;
      --fg: #ece3d6;
    }
  }
  :root[data-theme="dark"]{
    --bg: #1c1210;
    --fg: #ece3d6;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100svh;
    background:
      radial-gradient(circle at 50% 20%, rgba(203,161,90,0.10), transparent 55%),
      var(--bg);
    color: var(--fg);
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 6vh 5vw 8vh;
    overflow-x:hidden;
  }

  .eyebrow{
    font-family:'Cormorant SC', 'Cormorant Garamond', serif;
    letter-spacing:.22em;
    font-size: clamp(11px, 1.6vw, 13px);
    color: var(--gold);
    margin-bottom: 22px;
    text-align:center;
  }

  /* ---------- stage: closed (portrait) and open (landscape) each get their own generous, independently-computed size (see JS layout()) ---------- */
  .stage{
    position:relative;
    width: var(--open-w, min(92vw,680px));
    min-height: var(--stage-h, 60vh);
    display:flex;
    align-items:center;
    justify-content:center;
    perspective: 2400px;
    perspective-origin: 50% 50%;
  }

  .viewport{
    position:relative;
    width: var(--closed-w, min(84vw,380px));
    height: var(--closed-h, 60vh);
    overflow:hidden;
    border-radius:6px;
    filter: drop-shadow(0 22px 30px var(--card-shadow));
    transform-origin:center center;
    transition: width .85s cubic-bezier(.65,.05,.24,1), height .85s cubic-bezier(.65,.05,.24,1), transform 1s cubic-bezier(.65,.05,.24,1);
    transition-delay: 0s, 0s, 0s;
  }
  .stage.open .viewport{
    width: var(--open-w, min(92vw,680px));
    height: var(--open-h, 40vh);
    transition-delay: .55s, .55s, 0s;
  }
  .stage.closing .viewport{ transition-delay: 0s, 0s, 0s; }
  /* rotated for reading: turn 90deg and scale down so the widened footprint still fits the screen */
  .viewport.rotated{ transform: rotate(90deg) scale(var(--rotate-scale, .72)); }

  /* content holds both pages at their native open-state width; closed = horizontally zoomed+shifted to fill the (narrower, taller) closed viewport with just the right page */
  .content{
    position:absolute; top:0; left:0;
    width: calc(var(--page-w, min(46vw,340px)) * 2);
    height: var(--open-h, min(92vw,640px)*.707);
    transform-origin: 0 0;
    transform: translateX(calc(var(--page-w, min(46vw,340px)) * var(--closed-scale, 1) * -1)) scale(var(--closed-scale, 1));
    transition: transform .85s cubic-bezier(.65,.05,.24,1);
    transition-delay: 0s;
  }
  .stage.open .content{ transform: translateX(0) scale(1); transition-delay: .55s; }
  .stage.closing .content{ transition-delay: 0s; }

  .page{
    position:absolute; top:0; bottom:0;
    width: var(--page-w, min(46vw,340px));
    overflow:hidden;
    background: var(--cream);
  }
  .page img{ width:100%; height:100%; object-fit:cover; display:block; }
  .page-left{ left:0; border-radius:6px 0 0 6px; }
  .page-right{ left: var(--page-w, min(46vw,340px)); border-radius:0 6px 6px 0; z-index:1; }
  .page-right::before{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(90deg, rgba(20,8,10,.35), rgba(20,8,10,0) 20%);
    opacity:0;
    transition: opacity .8s ease .2s;
    pointer-events:none;
  }
  .stage.open .page-right::before{ opacity:1; }

  .cover{
    position:absolute; top:0; bottom:0; left:var(--page-w, min(46vw,340px)); width:var(--page-w, min(46vw,340px));
    z-index:3;
    transform-style: preserve-3d;
    transform-origin: left center;
    transition: transform .95s cubic-bezier(.62,.02,.24,1);
  }
  .stage.open .cover{ transform: rotateY(-90deg); transition-delay: 0s; }
  .stage.closing .cover{ transition-delay: .5s; }
  .cover-face{
    position:absolute; inset:0;
    overflow:hidden;
    backface-visibility:hidden;
  }
  .cover-face img{ width:100%; height:100%; object-fit:cover; display:block; }
  .cover-front{ border-radius:0 6px 6px 0; }
  .cover-back{ transform: rotateY(180deg); border-radius:6px 0 0 6px; }

  .spine{
    position:absolute; top:0; bottom:0; left:var(--page-w, min(46vw,340px));
    width:16px; margin-left:-8px;
    background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.35), rgba(0,0,0,0));
    z-index:4;
    pointer-events:none;
    opacity:.85;
  }

  .hittarget{
    position:absolute; inset:0; z-index:5;
    cursor:pointer;
    background:transparent;
    border:none;
    padding:0;
  }
  .stage.open .hittarget{ cursor:default; pointer-events:none; }

  .hint{
    margin-top:26px;
    font-size: clamp(14px, 2.3vw, 16px);
    letter-spacing:.04em;
    opacity:.72;
    text-align:center;
    transition: opacity .5s ease, transform .5s ease;
    animation: pulse 2.6s ease-in-out infinite;
  }
  .hint span{
    display:inline-block;
    border-bottom: 1px solid var(--gold);
    padding-bottom:2px;
  }
  .hint.is-hidden{ opacity:0; transform: translateY(-6px); pointer-events:none; animation:none; }

  @keyframes pulse{ 0%,100%{ opacity:.55; } 50%{ opacity:.9; } }

  .controls{
    margin-top:26px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition: opacity .5s ease .25s;
  }
  .controls.is-visible{ opacity:1; pointer-events:auto; }

  .ctrl-btn{
    font-family:'Cormorant Garamond', serif;
    font-size:15px;
    letter-spacing:.06em;
    color: var(--fg);
    background:none;
    border:1px solid var(--gold);
    border-radius:999px;
    padding:8px 20px;
    cursor:pointer;
    transition: background .2s ease;
  }
  .ctrl-btn:hover{ background: rgba(203,161,90,.12); }

  .caption{
    margin-top: 34px;
    text-align:center;
    opacity:.85;
  }
  .caption .names{
    font-family:'Cormorant SC', 'Cormorant Garamond', serif;
    font-size: clamp(20px,3vw,24px);
    letter-spacing:.08em;
    color: var(--gold);
  }
  .caption .meta{
    margin-top:4px;
    font-size: clamp(13px,2vw,15px);
    letter-spacing:.03em;
    opacity:.75;
  }

  @media (prefers-reduced-motion: reduce){
    .viewport, .content, .cover, .hint, .controls, .page-right::before{ transition:none; animation:none; }
  }
</style>
</head>

    <button class="hittarget" id="hitTarget" aria-label="Abrir pasaporte" aria-pressed="false"></button>
  </div>

  <p class="hint is-hidden" id="hint"><span>Toca para abrir tu pasaporte</span></p>

  <div class="controls" id="controls">
    <button class="ctrl-btn" id="rotateBtn" type="button">⟲ Girar para leer</button>
    <button class="ctrl-btn" id="closeBtn" type="button">Cerrar pasaporte</button>
  </div>

  <div class="caption">
    <div class="names">04 · junio · 2027</div>
    <div class="meta">Talavera de la Reina</div>
  </div>

<script>
  const stage = document.getElementById('stage');
  const viewport = document.getElementById('viewport');
  const hitTarget = document.getElementById('hitTarget');
  const hint = document.getElementById('hint');
  const controls = document.getElementById('controls');
  const rotateBtn = document.getElementById('rotateBtn');
  const closeBtn = document.getElementById('closeBtn');

  // Closed (portrait cover) and open (two-page spread) get their own generous,
  // independently-sized footprints; a safe scale keeps the "rotate to read" mode on screen.
  function layout(){
    const vw = window.innerWidth;

    const closedW = Math.min(vw * 0.84, 380);
    const closedH = closedW * 1414 / 1000;

    const openW = Math.min(vw * 0.92, 640);
    const openH = openW * 1414 / 2000;

    const pageW = openW / 2;
    const closedScale = closedW / pageW;

    // rotated: viewport's open box (openW x openH) turns 90deg, so its visual
    // footprint becomes openH wide x openW tall; scale it to stay within the screen.
    const rotateScale = Math.min(1, (vw * 0.9) / openH);
    const rotatedVisualH = openW * rotateScale;

    const stageH = Math.max(closedH, openH, rotatedVisualH) + 24;

    stage.style.setProperty('--closed-w', closedW + 'px');
    stage.style.setProperty('--closed-h', closedH + 'px');
    stage.style.setProperty('--open-w', openW + 'px');
    stage.style.setProperty('--open-h', openH + 'px');
    stage.style.setProperty('--page-w', pageW + 'px');
    stage.style.setProperty('--closed-scale', closedScale);
    stage.style.setProperty('--rotate-scale', rotateScale);
    stage.style.setProperty('--stage-h', stageH + 'px');
  }
  layout();
  window.addEventListener('resize', layout);

  // hint starts visible (removed is-hidden after load so the pulse animation restarts cleanly)
  requestAnimationFrame(() => hint.classList.remove('is-hidden'));

  function openPassport(){
    stage.classList.add('open');
    hitTarget.setAttribute('aria-pressed','true');
    hitTarget.setAttribute('aria-label','Pasaporte abierto');
    hint.classList.add('is-hidden');
    controls.classList.add('is-visible');
  }
  function closePassport(){
    stage.classList.add('closing');
    stage.classList.remove('open');
    viewport.classList.remove('rotated');
    rotateBtn.textContent = '⟲ Girar para leer';
    hitTarget.setAttribute('aria-pressed','false');
    hitTarget.setAttribute('aria-label','Abrir pasaporte');
    hint.classList.remove('is-hidden');
    controls.classList.remove('is-visible');
    window.setTimeout(() => stage.classList.remove('closing'), 1600);
  }
  function toggleRotate(){
    const isRotated = viewport.classList.toggle('rotated');
    rotateBtn.textContent = isRotated ? '⟳ Volver a girar' : '⟲ Girar para leer';
  }

  hitTarget.addEventListener('click', () => {
    if(!stage.classList.contains('open')) openPassport();
  });
  hitTarget.addEventListener('keydown', (e) => {
    if((e.key === 'Enter' || e.key === ' ') && !stage.classList.contains('open')){
      e.preventDefault();
      openPassport();
    }
  });
  rotateBtn.addEventListener('click', toggleRotate);
  closeBtn.addEventListener('click', closePassport);
</script>
